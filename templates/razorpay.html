{% extends "base.html" %}{% block content %}
<section class="max-w-md mx-auto px-4 py-16 text-center"><p>Opening secure payment…</p>
<form id="f" method="post" action="{% url 'razorpay_verify' %}">{% csrf_token %}<input type="hidden" name="razorpay_order_id" value="{{ order_id }}"><input type="hidden" name="razorpay_payment_id" id="pid"><input type="hidden" name="razorpay_signature" id="sig"></form>
<a class="btn mt-6" href="{% url 'checkout' b.code %}">Back</a></section>{% endblock %}
{% block scripts %}<script src="https://checkout.razorpay.com/v1/checkout.js"></script><script>
addEventListener('load',()=>{new Razorpay({key:"{{ key }}",amount:"{{ amount }}",currency:"INR",order_id:"{{ order_id }}",name:"{{ SITE_NAME|escapejs }}",
handler:r=>{pid.value=r.razorpay_payment_id;sig.value=r.razorpay_signature;f.submit()}}).open()});</script>{% endblock %}
