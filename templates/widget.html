{% load ui %}<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><script src="https://cdn.tailwindcss.com"></script></head>
<body style="background:#FBF8F3;color:#1B2A49" class="p-4 font-sans"><p class="font-semibold mb-3">Heritage walks near {{ hotel.name }}</p>
<div class="grid gap-3 sm:grid-cols-2">{% for t in tours %}<a target="_top" href="{{ t.get_absolute_url }}?ref={{ hotel.code }}" class="flex items-center gap-3 rounded-2xl bg-white border p-3 hover:shadow-lg"><span style="color:#C65D3B">{% icon t.icon "w-8 h-8" %}</span><span class="flex-1 text-sm font-medium">{{ t.title }}</span><span class="text-sm">₹{{ t.price }}</span></a>{% endfor %}</div></body></html>
