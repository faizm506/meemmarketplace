{% extends "base.html" %}{% block content %}
<section class="max-w-md mx-auto px-4 py-12"><h1 class="font-serif text-4xl">Welcome back</h1>
<form method="post" class="mt-6 space-y-3 rounded-3xl bg-white border border-sand p-6">{% csrf_token %}{{ form.as_p }}{% if request.GET.next %}<input type="hidden" name="next" value="{{ request.GET.next }}">{% endif %}<button class="btn w-full">Log in</button></form><p class="text-sm mt-4">New here? <a class="underline" href="{% url 'signup' %}">Create an account</a></p></section>{% endblock %}
