{% load ui %}<a href="{{ t.get_absolute_url }}" class="card reveal block rounded-3xl bg-white overflow-hidden border border-sand/60">
 <div class="h-40 jali bg-gradient-to-br from-sand via-gold/40 to-terra/70 flex items-center justify-center text-terra">{% icon t.icon "w-14 h-14" %}</div>
 <div class="p-5"><p class="text-xs font-semibold text-terra uppercase tracking-wide">{{ t.category.name }}</p>
  <h3 class="font-serif text-xl mt-1">{{ t.title }}</h3>
  <p class="text-sm text-indigo/70 mt-2 line-clamp-2">{{ t.description }}</p>
  <div class="flex justify-between items-center mt-4 text-sm"><span>{% icon "clock" "w-4 h-4 inline" %} {{ t.duration_hours|floatformat:"-1" }} h</span><span class="font-semibold">₹{{ t.price }} <span class="font-normal text-indigo/60">/ person</span></span></div></div></a>
